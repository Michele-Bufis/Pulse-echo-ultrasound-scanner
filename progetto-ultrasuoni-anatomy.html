<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Pulse-Echo a Ultrasuoni</title>
<style id="anatomy-css"></style>
<style>
/* PAGE_CSS, as in kit/iso-kit.mjs (the width is the card width in px) */
*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
/* the small theme switch, top right */
.anatomy-theme{position:fixed;top:12px;right:12px;z-index:5;display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid var(--anatomy-lo);border-radius:50%;background:var(--anatomy-card);color:var(--anatomy-mid);cursor:pointer;opacity:.7;transition:opacity .2s,color .2s}
.anatomy-theme:hover,.anatomy-theme:focus-visible{opacity:1;color:var(--anatomy-strong)}

/* Layout con barra di controllo verticale a sinistra */
.iso-stage-wrap {
  position: relative;
  display: flex;
  align-items: stretch;
  gap: 16px;
}
.iso-scrubber {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  width: 38px;
  padding: 10px 0;
  border: 1px solid var(--anatomy-faint);
  background: var(--anatomy-page);
  user-select: none;
  touch-action: none;
  cursor: ns-resize;
  flex-shrink: 0;
  transition: border-color .2s;
  z-index: 4;
}
.iso-scrubber:hover,
.iso-scrubber:focus-visible {
  border-color: var(--anatomy-mid);
  outline: none;
}
.iso-scrubber-label {
  font-family: var(--anatomy-mono);
  font-size: 9px;
  color: var(--anatomy-muted);
  letter-spacing: .02em;
  line-height: 1.15;
  text-align: center;
}
.iso-scrubber-track {
  position: relative;
  flex: 1;
  width: 4px;
  margin: 10px 0;
  background: var(--anatomy-faint);
  border-radius: 2px;
}
.iso-scrubber-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 0%;
  background: var(--anatomy-mid);
  border-radius: 2px;
  pointer-events: none;
}
.iso-scrubber-thumb {
  position: absolute;
  left: 50%;
  top: 100%;
  width: 20px;
  height: 9px;
  background: var(--anatomy-lit);
  border: 1px solid var(--anatomy-page);
  border-radius: 2px;
  transform: translate(-50%, -50%);
  box-shadow: 0 1px 3px rgba(0,0,0,.5);
  pointer-events: none;
  transition: transform .1s;
}
.iso-scrubber:hover .iso-scrubber-thumb,
.iso-scrubber:focus-visible .iso-scrubber-thumb {
  transform: translate(-50%, -50%) scale(1.15);
}
.iso-stage {
  position: relative;
  flex: 1;
  min-width: 0;
  outline: none;
}

/* Pulsante rapido per aprire l'ecografia B-mode */
.bmode-trigger {
  position: absolute;
  bottom: 8px;
  right: 8px;
  z-index: 2;
  padding: 4px 9px;
  border: 1px solid var(--anatomy-lo);
  background: var(--anatomy-page);
  color: var(--anatomy-text);
  font-family: var(--anatomy-mono);
  font-size: 10px;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0.85;
  transition: opacity .2s, border-color .2s, color .2s;
}
.bmode-trigger:hover {
  opacity: 1;
  border-color: var(--anatomy-hi);
  color: var(--anatomy-strong);
}

/* Modal in primo piano con il fac-simile eco layer (B-mode) */
.bmode-overlay {
  position: absolute;
  inset: -12px 0 -12px 54px;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 10, 10, 0.78);
  backdrop-filter: blur(5px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s var(--anatomy-ease);
}
body[data-theme="light"] .bmode-overlay {
  background: rgba(242, 242, 239, 0.82);
}
.bmode-overlay[data-open="true"] {
  opacity: 1;
  pointer-events: auto;
}
.bmode-card {
  width: min(440px, 96%);
  background: var(--anatomy-card);
  border: 1px solid var(--anatomy-hi);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
  padding: 14px 16px 16px;
  transform: translateY(8px) scale(0.97);
  transition: transform .35s var(--anatomy-ease);
}
.bmode-overlay[data-open="true"] .bmode-card {
  transform: translateY(0) scale(1);
}
.bmode-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--anatomy-faint);
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--anatomy-strong);
}
.bmode-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.bmode-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--anatomy-green);
  box-shadow: 0 0 6px var(--anatomy-green);
}
.bmode-close {
  background: var(--anatomy-page);
  border: 1px solid var(--anatomy-lo);
  color: var(--anatomy-text);
  font-family: var(--anatomy-mono);
  font-size: 10px;
  padding: 3px 8px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.bmode-close:hover {
  border-color: var(--anatomy-hi);
  color: var(--anatomy-strong);
}
.bmode-screen {
  position: relative;
  background: #050709;
  border: 1px solid var(--anatomy-lo);
  aspect-ratio: 4 / 3.1;
  overflow: hidden;
}
.bmode-svg {
  display: block;
  width: 100%;
  height: 100%;
}
.bmode-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  font-family: var(--anatomy-mono);
  font-size: 10px;
  color: var(--anatomy-muted);
}

@media (max-width: 560px) {
  .iso-stage-wrap { gap: 8px; }
  .iso-scrubber { width: 30px; }
  .bmode-overlay { inset: -8px 0 -8px 38px; }
}
</style>
</head>
<body class="iso" data-theme="dark">
<button class="anatomy-theme" type="button" aria-label="Cambia tema chiaro/scuro" aria-pressed="false"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
<main class="iso-page" id="app"></main>

    lines.push(pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]));
  }
  return lines.join("");
}

return { frameOf, prismOf, disc, ringBand, ribsOf };
})();

/* ── la parte che si muove: tutto ciò che sta sull'anello ── */
function arm(deg) {
  const th = deg * RAD, c = Math.cos(th), s = Math.sin(th);
  const U = [c, s, 0], V = [-s, c, 0];
  const pt = (r, t, z) => [c * r - s * t, s * r + c * t, z];
  const out = [];
  const FZ = G.frameOf([0, 0, RING.z1], [0, 0, 1], U, V);
  out.push(S(G.prismOf(FZ, [[94, -16], [124, -16], [124, 16], [94, 16]], 0, PROBE_Z - RING.z1, P), { tone: "mid" }));
  out.push(D([[100, -10], [100, 10], [118, -10], [118, 10]].map(([r, t]) => at(pt(r, t, PROBE_Z))), { size: 0.45, tone: "lo" }));
  const cheeks = [-1, 1]
    .map((sign) => ({ sign, depth: k.depthOf(pt(108, sign * 13, 61), P) }))
    .sort((a, b) => a.depth - b.depth);
  const cheek = (sign) => S(G.prismOf(FZ, [[100, sign * 11.6], [116, sign * 11.6], [116, sign * 14.4], [100, sign * 14.4]], PROBE_Z - RING.z1, PROBE_Z - RING.z1 + 10, P), { tone: "mid" });
  out.push(cheek(cheeks[0].sign));
  const F = G.frameOf([(R_TANK + 0.4) * c, (R_TANK + 0.4) * s, PROBE_Z], U, [0, 0, 1], V);
  out.push(S(G.disc(-0.8, 0.5, 12.2, F, P), { tone: "lo", crease: "none" }));
  out.push(S(G.disc(0.5, 7, 11, F, P), { tone: "mid" }));
  out.push(L(G.ribsOf(F, 1.3, 6.2, 11, 30, P), { tone: "lo" }));
  out.push(S(G.disc(7, 44, PROBE_R, F, P), { tone: "hi", lit: true }));
  const bnc = pt(R_TANK + 0.4 + 36, 0, PROBE_Z + PROBE_R);
  out.push(S(k.cylinder(bnc[0], bnc[1], 3.2, bnc[2], 7, P, 20), { tone: "mid", lit: true }));
  out.push(D([at([bnc[0], bnc[1], bnc[2] + 7])], { size: 0.5, tone: "hi" }));
  out.push(cheek(cheeks[1].sign));
  return { svg: out.join(""), top: [bnc[0], bnc[1], bnc[2] + 7], front: k.depthOf(pt(R_TANK + 20, 0, PROBE_Z), P) >= 0 };
}

function cable(top) {
  const from = BNC_BOARD, points = [];
  for (let i = 0; i <= 12; i++) {
    const t = i / 12;
    points.push(at([from[0] + (top[0] - from[0]) * t, from[1] + (top[1] - from[1]) * t, from[2] + (top[2] - from[2]) * t + 42 * Math.sin(Math.PI * t)]));
  }
  return k.wireSvg(points[0], points[points.length - 1], { via: points.slice(1, -1), tone: "mid", size: 1.1 });
}

/* ── modello dell'eco: parete anteriore, strati interni del campione e parete di fondo ── */
const castCache = new Map();
function castOf(step) {
  const key = ((step % STEPS) + STEPS) % STEPS;
  if (castCache.has(key)) return castCache.get(key);
  const th = key * STEP_DEG * RAD, c = Math.cos(th), s = Math.sin(th);
  const o = [R_IN * c, R_IN * s], d = [-c, -s];
  const hits = [];
  for (const t of TARGETS) {
    const ox = o[0] - t.x, oy = o[1] - t.y;
    const b = ox * d[0] + oy * d[1], cc = ox * ox + oy * oy - t.r * t.r, disc = b * b - cc;
    if (disc >= 0 && -b - Math.sqrt(disc) > 0) {
      const tFront = -b - Math.sqrt(disc);
      const tBack = -b + Math.sqrt(disc);
      hits.push({ t: tFront, name: t.name, amp: t.amp });
      const internalShift = 1.8 * Math.cos(th - 0.6);
      const internalAmp = 9 + 5 * Math.max(0, Math.sin(th + 0.4));
      hits.push({ t: (tFront + tBack) / 2 + internalShift, name: "nucleo interno", amp: internalAmp });
      hits.push({ t: tBack, name: "parete post. campione", amp: t.amp * 0.55 });
    }
  }
  hits.push({ t: 2 * R_IN, name: WALL.name, amp: WALL.amp });
  hits.sort((a, b) => a.t - b.t);
  const pts = [[xOf(0), SCOPE_BASE], [xOf(0.4), SCOPE_BASE - 26], [xOf(2.4), SCOPE_BASE - 6], [xOf(4), SCOPE_BASE - 12], [xOf(6.5), SCOPE_BASE - 1]];
  for (const h of hits) {
    const us = (2 * h.t) / C_MM_US;
    if (us > US_MAX - 4) continue;
    pts.push([xOf(us - 1.4), SCOPE_BASE], [xOf(us), SCOPE_BASE - h.amp], [xOf(us + 1), SCOPE_BASE - h.amp * 0.35], [xOf(us + 2.2), SCOPE_BASE - h.amp * 0.55], [xOf(us + 3.6), SCOPE_BASE]);
  }
  pts.push([xOf(US_MAX), SCOPE_BASE]);
  const result = { o, d, hits, first: hits[0], us: (2 * hits[0].t) / C_MM_US, trace: pts };
  castCache.set(key, result);
  return result;
}

function beamSvg(cast, cur) {
  const { o, d, first } = cast;
  const travel = C_MM_US * cur, pos = travel <= first.t ? travel : travel <= 2 * first.t ? 2 * first.t - travel : -1;
  const hit = [o[0] + d[0] * first.t, o[1] + d[1] * first.t];
  const out = [L(k.lineOnTop(o, hit, PROBE_Z, P), { tone: "faint", dashed: true })];
  if (pos >= 0) {
    const perp = [-d[1], d[0]];
    const packet = [0, 2.6, 5.2].map((back) => {
      const centre = [o[0] + d[0] * (pos - (travel <= first.t ? back : -back)), o[1] + d[1] * (pos - (travel <= first.t ? back : -back))];
      return k.lineOnTop([centre[0] - perp[0] * 7, centre[1] - perp[1] * 7], [centre[0] + perp[0] * 7, centre[1] + perp[1] * 7], PROBE_Z, P);
    });
    out.push(L(packet.join(""), { tone: "lit" }));
  }
  if (travel > first.t) {
    const radius = Math.min(10, (travel - first.t) * 0.3);
    if (radius > 0.4) out.push(L(k.ring(hit[0], hit[1], radius, PROBE_Z, P, 28), { tone: "lit" }));
  }
  out.push(D([at([hit[0], hit[1], PROBE_Z])], { size: 0.7, tone: "lit" }));
  return out.join("");
}

function traceSvg(cast, cur) {
  const limit = xOf(cur), points = [];
  for (let i = 0; i < cast.trace.length; i++) {
    const p = cast.trace[i];
    if (p[0] <= limit) { points.push(p); continue; }
    if (i > 0) { const q = cast.trace[i - 1], f = (limit - q[0]) / (p[0] - q[0]); points.push([limit, q[1] + (p[1] - q[1]) * f]); }
    break;
  }
  const line = points.length > 1 ? L(k.onTop(points, SCOPE_Z + 0.1, P), { tone: "lit" }) : "";
  const cursor = L(k.lineOnTop([limit, SCOPE_BASE + 2], [limit, SCOPE_BASE - 34], SCOPE_Z + 0.1, P), { tone: "mid" });
  return line + cursor;
}

/* ── Generatore del fac-simile Ecografico B-Mode (sezione interna dell'oggetto) ── */
function buildBmodeSvg() {
  const cx = 190, cy = 140;
  const speckles = [];
  for (let i = 0; i < 260; i++) {
    const a = (i * 137.508) * RAD;
    const r = Math.sqrt((i + 0.5) / 260) * 66;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    const distCyst = Math.hypot((x - (cx - 21)) / 20, (y - (cy - 12)) / 15);
    if (distCyst < 0.92) continue;
    const distCore = Math.hypot(x - (cx + 18), y - (cy + 14));
    const inCore = distCore < 17;
    const op = inCore ? 0.55 + (i % 4) * 0.11 : 0.12 + (i % 5) * 0.06;
    const sz = inCore ? 1.3 + (i % 3) * 0.45 : 0.8 + (i % 3) * 0.35;
    speckles.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sz.toFixed(1)}" fill="#d8efe6" fill-opacity="${op.toFixed(2)}"/>`);
  }

  const rays = Array.from({ length: 36 }, (_, i) => {
    const a = (i * 10) * RAD;
    return `<line x1="${(cx + 18 * Math.cos(a)).toFixed(1)}" y1="${(cy + 18 * Math.sin(a)).toFixed(1)}" x2="${(cx + 122 * Math.cos(a)).toFixed(1)}" y2="${(cy + 122 * Math.sin(a)).toFixed(1)}" stroke="#6be0a0" stroke-opacity="0.06" stroke-width="0.6"/>`;
  }).join("");

  const grayBar = Array.from({ length: 8 }, (_, i) => {
    const v = Math.round(25 + (i / 7) * 220);
    return `<rect x="14" y="${38 + i * 16}" width="7" height="14" fill="rgb(${v},${v},${v})" stroke="#2a353b" stroke-width="0.5"/>`;
  }).join("");

  return `
  <svg class="bmode-svg" viewBox="0 0 380 280" role="img" aria-label="Immagine ecografica B-mode che mostra la sezione trasversale dell'oggetto e i suoi strati interni">
    <defs>
      <radialGradient id="eco-water" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#0d171a"/>
        <stop offset="75%" stop-color="#070c0e"/>
        <stop offset="100%" stop-color="#040608"/>
      </radialGradient>
      <radialGradient id="eco-stroma" cx="46%" cy="44%" r="52%">
        <stop offset="0%" stop-color="#3a4c48"/>
        <stop offset="70%" stop-color="#253230"/>
        <stop offset="92%" stop-color="#4f6762"/>
        <stop offset="100%" stop-color="#d8efe6"/>
      </radialGradient>
      <radialGradient id="eco-core" cx="45%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="55%" stop-color="#b5dcd0"/>
        <stop offset="100%" stop-color="#4e6962"/>
      </radialGradient>
      <filter id="eco-glow" x="-15%" y="-15%" width="130%" height="130%">
        <feGaussianBlur stdDeviation="1.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <rect width="380" height="280" fill="#050709"/>
    <circle cx="${cx}" cy="${cy}" r="122" fill="url(#eco-water)" stroke="#26343a" stroke-width="0.8" stroke-dasharray="2 3"/>
    ${rays}

    <circle cx="${cx}" cy="${cy}" r="96" fill="none" stroke="#1c2a2e" stroke-width="0.6" stroke-dasharray="3 3"/>
    <circle cx="${cx}" cy="${cy}" r="42" fill="none" stroke="#1c2a2e" stroke-width="0.6" stroke-dasharray="2 4"/>
    <line x1="${cx - 126}" y1="${cy}" x2="${cx + 126}" y2="${cy}" stroke="#1c2a2e" stroke-width="0.5"/>
    <line x1="${cx}" y1="${cy - 126}" x2="${cx}" y2="${cy + 126}" stroke="#1c2a2e" stroke-width="0.5"/>

    <!-- STRATO 1: Involucro / Capsula esterna iperecogena + Parenchima -->
    <circle cx="${cx}" cy="${cy}" r="70" fill="url(#eco-stroma)" stroke="#e6f7f0" stroke-width="2.2" filter="url(#eco-glow)"/>
    <circle cx="${cx}" cy="${cy}" r="66" fill="none" stroke="#8ab3a6" stroke-width="0.8" stroke-dasharray="5 2"/>

    <!-- STRATO 2: Setti / Anelli di stratificazione interna -->
    <circle cx="${cx}" cy="${cy}" r="48" fill="none" stroke="#6d8f85" stroke-width="0.9" stroke-dasharray="6 4" opacity="0.7"/>
    <ellipse cx="${cx + 4}" cy="${cy + 3}" rx="34" ry="29" fill="#1c2726" fill-opacity="0.45" stroke="#7da398" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- STRATO 3: Cavità cistica anecogena -->
    <path d="M ${cx - 42} ${cy - 4} Q ${cx - 21} ${cy + 16} ${cx - 2} ${cy - 4}" fill="none" stroke="#9ec7b9" stroke-width="2.5" opacity="0.35"/>
    <ellipse cx="${cx - 21}" cy="${cy - 12}" rx="20" ry="15" fill="#05080a" stroke="#9ec7b9" stroke-width="1.2"/>

    <!-- STRATO 4: Nucleo denso iperecogeno -->
    <circle cx="${cx + 18}" cy="${cy + 14}" r="16" fill="url(#eco-core)" stroke="#ffffff" stroke-width="1.5" filter="url(#eco-glow)"/>
    <circle cx="${cx + 15}" cy="${cy + 11}" r="5.5" fill="#ffffff"/>

    <g>${speckles.join("")}</g>

    ${grayBar}
    <text x="14" y="28" fill="#6e848a" font-family="monospace" font-size="8">TGC</text>
    <text x="312" y="26" fill="#6be0a0" font-family="monospace" font-size="8.5" text-anchor="end">5.0 MHz · B-MODE</text>
    <text x="366" y="26" fill="#8fa6ac" font-family="monospace" font-size="8.5" text-anchor="end">200 LINEE</text>

    <g font-family="monospace" font-size="8.5" fill="#d8efe6">
      <polyline points="${cx + 49},${cy - 49} ${cx + 78},${cy - 76} 358,${cy - 76}" fill="none" stroke="#6be0a0" stroke-width="0.8"/>
      <circle cx="${cx + 49}" cy="${cy - 49}" r="1.8" fill="#6be0a0"/>
      <text x="358" y="${cy - 80}" text-anchor="end" fill="#6be0a0">1. INVOLUCRO ESTERNO</text>
      <text x="358" y="${cy - 67}" text-anchor="end" fill="#8fa6ac" font-size="7.5">interfaccia acqua/parete</text>

      <polyline points="${cx - 26},${cy - 15} ${cx - 78},${cy - 56} 32,${cy - 56}" fill="none" stroke="#6b9bff" stroke-width="0.8"/>
      <circle cx="${cx - 26}" cy="${cy - 15}" r="1.8" fill="#6b9bff"/>
      <text x="32" y="${cy - 60}" fill="#6b9bff">2. CAVITÀ ANECOGENA</text>
      <text x="32" y="${cy - 47}" fill="#8fa6ac" font-size="7.5">fluido interno (assenza echi)</text>

      <polyline points="${cx - 12},${cy + 36} ${cx - 72},${cy + 78} 32,${cy + 78}" fill="none" stroke="#b5dcd0" stroke-width="0.8"/>
      <circle cx="${cx - 12}" cy="${cy + 36}" r="1.8" fill="#b5dcd0"/>
      <text x="32" y="${cy + 74}" fill="#d8efe6">3. MATRICE INTERNA</text>
      <text x="32" y="${cy + 87}" fill="#8fa6ac" font-size="7.5">tessuto medio-ecogeno (speckle)</text>

      <polyline points="${cx + 24},${cy + 20} ${cx + 82},${cy + 68} 358,${cy + 68}" fill="none" stroke="#ffffff" stroke-width="0.8"/>
      <circle cx="${cx + 24}" cy="${cy + 20}" r="1.8" fill="#ffffff"/>
      <text x="358" y="${cy + 64}" text-anchor="end" fill="#ffffff">4. NUCLEO DENSO</text>
      <text x="358" y="${cy + 77}" text-anchor="end" fill="#8fa6ac" font-size="7.5">inclusione iperecogena</text>
    </g>

    <g stroke="#5b7075" stroke-width="0.8">
      <line x1="140" y1="264" x2="240" y2="264"/>
      <line x1="140" y1="260" x2="140" y2="267"/>
      <line x1="190" y1="261" x2="190" y2="266"/>
      <line x1="240" y1="260" x2="240" y2="267"/>
    </g>
    <text x="190" y="257" fill="#8fa6ac" font-family="monospace" font-size="8" text-anchor="middle">Ø 28 mm (scala 1:5)</text>
  </svg>`;
}

/* ── montaggio ── */
const nearY = k.iso([0, 0, BELT_Z], P)[1];
const svg = k.figureSvg({
  width: WIDTH,
  height: HEIGHT,
  label:
    "Un banco per l'ecografia a ultrasuoni con un singolo campione cilindrico al centro della vasca. Al termine del giro di 360 gradi viene mostrata in primo piano la sezione ecografica B-mode con gli strati interni dell'oggetto.",
  body: [
    `<defs><clipPath id="clip-far"><rect x="0" y="0" width="${WIDTH}" height="${nearY.toFixed(1)}"/></clipPath><clipPath id="clip-near"><rect x="0" y="${nearY.toFixed(1)}" width="${WIDTH}" height="${HEIGHT}"/></clipPath></defs>`,
    baseLayer(),
    boardLayer(),
    scopeLayer(),
    `<g data-part="trace"></g>`,
    `<g clip-path="url(#clip-far)" style="fill-rule:evenodd">${drumRing()}</g>`,
    `<g data-part="armBack"></g>`,
    tankLayer(),
    `<g data-part="beam"></g>`,
    `<g clip-path="url(#clip-near)" style="fill-rule:evenodd">${drumRing()}</g>`,
    motorLayer(),
    `<g data-part="armFront"></g>`,
    `<g data-part="cable"></g>`,
  ],
});

document.getElementById("app").innerHTML = k.plateHtml({
  fig: "Fig 1",
  title: "Tomografia Pulse-Echo a 360°",
  hint: "Scorri la barra dal basso verso l'alto (fino a 360°) per rivelare l'ecografia",
  readout: "avvio…",
  keys: [
    { mark: "lit", label: "Sonda 5 MHz, pacchetto d'onda ed echi A-mode" },
    { mark: "raised", label: "Campione cilindrico multistrato al centro (0, 0)" },
  ],
  caption:
    "Il campione è posto esattamente al centro dell'anello rotante. Mentre la sonda compie l'intero giro di 360° (200 passi da 1,8°), raccoglie gli echi della capsula esterna e delle disomogeneità interne. Al termine del giro completo compare in primo piano la ricostruzione tomografica B-mode che rivela gli strati e il contenuto dell'oggetto.",
  body: `
    <div class="iso-stage-wrap">
      <div class="iso-scrubber" tabindex="0" role="slider" aria-label="Controllo rotazione anello: scorri dal basso verso l'alto fino a 360 gradi per vedere la sezione ecografica" aria-valuemin="0" aria-valuemax="${STEPS}" aria-valuenow="0">
        <span class="iso-scrubber-label">360°<br>ECO</span>
        <div class="iso-scrubber-track">
          <div class="iso-scrubber-fill"></div>
          <div class="iso-scrubber-thumb"></div>
        </div>
        <span class="iso-scrubber-label">0°</span>
      </div>
      <div class="iso-stage">
        ${svg}
        <button class="bmode-trigger" type="button" data-open-bmode>Mostra B-mode</button>
      </div>
      <div class="bmode-overlay" data-open="false" role="dialog" aria-modal="false" aria-label="Sezione ecografica B-mode dell'oggetto centrale">
        <div class="bmode-card">
          <div class="bmode-header">
            <span class="bmode-badge"><span class="bmode-dot"></span>Ricostruzione B-Mode · Giro 360° completato</span>
            <button class="bmode-close" type="button" data-close-bmode>Nuova scansione ✕</button>
          </div>
          <div class="bmode-screen">
            ${buildBmodeSvg()}
          </div>
          <div class="bmode-footer">
            <span>Sezione trasversale (Z = 56 mm)</span>
            <span>c = 1480 m/s · 4 strati rilevati</span>
          </div>
        </div>
      </div>
    </div>
  `,
});

/* ── live: angolo, barra laterale (basso -> alto) e comparsa dell'ecografia a fine giro ── */
const stage = document.querySelector(".iso-stage");
const scrubber = document.querySelector(".iso-scrubber");
const trackEl = scrubber.querySelector(".iso-scrubber-track");
const fillEl = scrubber.querySelector(".iso-scrubber-fill");
const thumbEl = scrubber.querySelector(".iso-scrubber-thumb");
const overlayEl = document.querySelector(".bmode-overlay");
const closeBtn = document.querySelector("[data-close-bmode]");
const openBtn = document.querySelector("[data-open-bmode]");
const svgEl = stage.querySelector("svg");
const part = (name) => svgEl.querySelector(`[data-part="${name}"]`);
const armBack = part("armBack"), armFront = part("armFront"), cableEl = part("cable"), beamEl = part("beam"), traceEl = part("trace");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

let angle = 0, targetStep = 0, sweepT = -1, holdT = 0;
let frame = 0, last = 0, touring = !still.matches, visible = false, idleTimer = 0;
let shownAngle = NaN, shownKey = "";
let bmodeShown = false;

const settled = () => Math.abs(targetStep * STEP_DEG - angle) < 0.08;
const wrapDeg = (value) => ((value % 360) + 360) % 360;

function setBmodeOpen(open) {
  bmodeShown = open;
  overlayEl.setAttribute("data-open", String(open));
}

function draw() {
  const progress = Math.min(1, Math.max(0, angle / 360));
  const deg = wrapDeg(angle);
  const idle = settled();
  const step = Math.min(STEPS - 1, Math.round(deg / STEP_DEG) % STEPS);

  if (angle !== shownAngle) {
    const built = arm(deg);
    armBack.innerHTML = built.front ? "" : built.svg;
    armFront.innerHTML = built.front ? built.svg : "";
    cableEl.innerHTML = cable(built.top);
    shownAngle = angle;

    /* Dal basso (100% top) verso l'alto (0% top) */
    const pct = progress * 100;
    thumbEl.style.top = `${(100 - pct).toFixed(2)}%`;
    fillEl.style.height = `${pct.toFixed(2)}%`;
  }

  const cur = sweepT < 0 ? -1 : (sweepT / SWEEP_S) * US_MAX;
  const key = idle && cur >= 0 ? `${step}:${Math.round(cur * 2)}` : "off";
  if (key !== shownKey) {
    shownKey = key;
    if (key === "off") { beamEl.innerHTML = ""; traceEl.innerHTML = ""; }
    else { const cast = castOf(step); beamEl.innerHTML = beamSvg(cast, cur); traceEl.innerHTML = traceSvg(cast, cur); }
  }

  let text;
  if (bmodeShown) {
    text = `scansione 360° completata · vista B-mode attiva`;
  } else if (!idle || cur < 0) {
    text = `anello in rotazione · θ ${fmt(Math.min(360, angle))}°`;
  } else {
    const cast = castOf(step);
    text = `linea ${Math.min(STEPS, Math.round(angle / STEP_DEG) + 1)}/${STEPS} · θ ${fmt(Math.min(360, angle))}° · ` +
      (cur >= cast.us ? `eco da ${cast.first.name}: ${fmt(cast.us, 0)} µs · ${fmt(cast.first.t / 10)} cm` : `in ascolto… ${fmt(cur, 0)} µs`);
  }
  if (readout.textContent !== text) readout.textContent = text;
  scrubber.setAttribute("aria-valuenow", String(Math.round(progress * STEPS)));
  scrubber.setAttribute("aria-valuetext", text);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches, goal = targetStep * STEP_DEG;
  angle = calm ? goal : angle + (goal - angle) * (1 - Math.exp(-dt / 0.12));
  if (Math.abs(goal - angle) < 0.08) angle = goal;

  if (!settled()) {
    sweepT = -1;
    holdT = 0;
  } else {
    if (sweepT < 0) sweepT = calm ? SWEEP_S : 0;
    else if (sweepT < SWEEP_S) sweepT = Math.min(SWEEP_S, sweepT + dt);
    else {
      if (targetStep >= STEPS && !bmodeShown) {
        setBmodeOpen(true);
        touring = false;
      } else if (touring && !bmodeShown) {
        holdT += dt;
        if (holdT >= HOLD_S) {
          targetStep = Math.min(STEPS, targetStep + TOUR_JUMP);
          sweepT = -1;
          holdT = 0;
        }
      }
    }
  }
  draw();
  const quiet = !touring && settled() && sweepT >= SWEEP_S;
  frame = visible && !quiet ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };

const steer = (nextStep) => {
  const clamped = Math.max(0, Math.min(STEPS, nextStep));
  touring = false;
  if (clamped < STEPS - 2 && bmodeShown) {
    setBmodeOpen(false);
  }
  if (clamped >= STEPS) {
    setBmodeOpen(true);
  }
  if (clamped !== targetStep) {
    targetStep = clamped;
    sweepT = -1;
    holdT = 0;
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!bmodeShown && targetStep < STEPS) {
      touring = !still.matches;
      holdT = 0;
      run();
    }
  }, 5000);
  run();
};

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

/* Gestione trascinamento e clic sulla barra laterale sinistra (dal basso = 0 verso l'alto = STEPS) */
let dragging = false;
const updateFromBar = (clientY) => {
  const box = trackEl.getBoundingClientRect();
  if (!box.height) return;
  const share = Math.min(1, Math.max(0, (box.bottom - clientY) / box.height));
  const step = Math.round(share * STEPS);
  steer(step);
};

scrubber.addEventListener("pointerdown", (event) => {
  dragging = true;
  scrubber.setPointerCapture(event.pointerId);
  scrubber.focus();
  updateFromBar(event.clientY);
});
scrubber.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  updateFromBar(event.clientY);
});
const stopDrag = (event) => {
  if (!dragging) return;
  dragging = false;
  if (scrubber.hasPointerCapture(event.pointerId)) {
    scrubber.releasePointerCapture(event.pointerId);
  }
};
scrubber.addEventListener("pointerup", stopDrag);
scrubber.addEventListener("pointercancel", stopDrag);

/* Supporto rotellina del mouse sulla barra laterale (scroll in su = avanza verso l'alto) */
scrubber.addEventListener("wheel", (event) => {
  event.preventDefault();
  const dir = Math.sign(event.deltaY);
  if (dir !== 0) steer(targetStep - dir * 4);
}, { passive: false });

/* Supporto tastiera (Freccia Su = avanza verso l'alto, Freccia Giù = scende verso 0°) */
scrubber.addEventListener("keydown", (event) => {
  const jump = event.shiftKey ? 10 : 2;
  let next = null;
  if (event.key === "ArrowUp" || event.key === "ArrowRight") next = targetStep + jump;
  if (event.key === "ArrowDown" || event.key === "ArrowLeft") next = targetStep - jump;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = STEPS;
  if (next === null) return;
  event.preventDefault();
  steer(next);
});

/* Pulsanti apertura/chiusura della foto B-mode */
closeBtn.addEventListener("click", () => {
  setBmodeOpen(false);
  targetStep = 0;
  angle = 0;
  sweepT = -1;
  holdT = 0;
  touring = !still.matches;
  draw();
  run();
});

openBtn.addEventListener("click", () => {
  targetStep = STEPS;
  angle = 360;
  setBmodeOpen(true);
  touring = false;
  draw();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && bmodeShown) {
    setBmodeOpen(false);
    draw();
  }
});

draw();
</script>
</body>
